site_name: Digital Design with Makerchip & TL-Verilog
site_description: An open curriculum for learning digital design through interactive, visual, game-based projects.
site_author: Ines Iraoui

theme:
  name: material
  palette:
    scheme: slate
    primary: deep purple
    accent: deep purple
  font:
    text: JetBrains Mono
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - toc.integrate
    - navigation.footer
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - attr_list
  - def_list
  - footnotes
  - md_in_html

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Get Started: get-started.md
  - Block 1 — Combinational Logic:
      - Overview: block-1/index.md
      - Module 1.1 — Logic Gates: block-1/module-1-1-logic-gates.md
      - Module 1.2 — The Multiplexer: block-1/module-1-2-mux.md
      - Module 1.3 — Decoders: block-1/module-1-3-decoder.md
      - Module 1.4 — Arithmetic Logic Units: block-1/module-1-4-alu.md
      - Project — Pixel Art: block-1/block-1-project.md
  - Block 2 — Sequential Logic:
      - Overview: block-2/index.md
      - Module 2.1 — Registers: block-2/module-2-1-registers.md
      - Module 2.2 — Counters: block-2/module-2-2-counters.md
      - Module 2.3 — Shift Registers: block-2/module-2-3-shift-registers.md
      - Module 2.4 — Finite State Machines: block-2/module-2-4-fsm.md
      - Project — Whack-a-Mole: block-2/block-2-project.md
  - Block 3 — Memory and Arrays:
      - Overview: block-3/index.md
      - Module 3.1 — Register Files: block-3/module-3-1-register-files.md
      - Module 3.2 — Memory (RAM): block-3/module-3-2-memory.md
      - Module 3.3 — The 2D Grid: block-3/module-3-3-grid.md
      - Module 3.4 — Reading and Writing the Grid: block-3/module-3-4-grid-ops.md
      - Module 3.5 — Collision Detection: block-3/module-3-5-collision.md
      - Project — Tetris: block-3/block-3-project.md
  - Block 4 — Building a Processor:
      - Overview: block-4/index.md
      - Module 4.1 — Anatomy of a Processor: block-4/module-4-1-anatomy.md
      - Module 4.2 — Instructions: block-4/module-4-2-instructions.md
      - Module 4.3 — Decode: block-4/module-4-3-decode.md
      - Module 4.4 — The Datapath: block-4/module-4-4-datapath.md
      - Module 4.5 — Branches and Memory: block-4/module-4-5-branches-memory.md
      - Module 4.6 — Pipelining: block-4/module-4-6-pipelining.md
      - Project — RISC-V CPU: block-4/block-4-project.md
  - Conclusion — You Built a Computer: conclusion.md
