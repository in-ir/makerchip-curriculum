<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 440" width="320" height="440">
  <style>
    .w  { stroke: #9575cd; stroke-width: 1.5; fill: none; }
    .box{ stroke: #9575cd; stroke-width: 1.5; fill: #1e1e2e; }
    .mux{ stroke: #9575cd; stroke-width: 1.5; fill: #2a1e3e; }
    .lb { font-family: "JetBrains Mono", monospace; font-size: 11px; fill: #cdd6f4; }
    .op { font-family: "JetBrains Mono", monospace; font-size: 10px; fill: #cdd6f4; }
    .sm { font-family: "JetBrains Mono", monospace; font-size: 8px;  fill: #7c6fa0; }
    .d  { fill: #9575cd; }
  </style>

  <!-- A bus -->
  <line class="w" x1="25" y1="25" x2="25" y2="342"/>
  <text class="lb" x="18" y="22">A</text>

  <!-- B bus -->
  <line class="w" x1="48" y1="25" x2="48" y2="268"/>
  <text class="lb" x="41" y="22">B</text>

  <!-- AND -->
  <circle class="d" cx="25" cy="55" r="3"/>
  <circle class="d" cx="48" cy="63" r="3"/>
  <line class="w" x1="25" y1="55" x2="95" y2="55"/>
  <line class="w" x1="48" y1="63" x2="95" y2="63"/>
  <rect class="box" x="95" y="45" width="68" height="26" rx="3"/>
  <text class="op" x="129" y="62" text-anchor="middle">AND</text>
  <line class="w" x1="163" y1="58" x2="170" y2="58"/>
  

  <!-- OR -->
  <circle class="d" cx="25" cy="96" r="3"/>
  <circle class="d" cx="48" cy="104" r="3"/>
  <line class="w" x1="25" y1="96" x2="95" y2="96"/>
  <line class="w" x1="48" y1="104" x2="95" y2="104"/>
  <rect class="box" x="95" y="86" width="68" height="26" rx="3"/>
  <text class="op" x="129" y="103" text-anchor="middle">OR</text>
  <line class="w" x1="163" y1="99" x2="170" y2="99"/>
  

  <!-- XOR -->
  <circle class="d" cx="25" cy="137" r="3"/>
  <circle class="d" cx="48" cy="145" r="3"/>
  <line class="w" x1="25" y1="137" x2="95" y2="137"/>
  <line class="w" x1="48" y1="145" x2="95" y2="145"/>
  <rect class="box" x="95" y="127" width="68" height="26" rx="3"/>
  <text class="op" x="129" y="144" text-anchor="middle">XOR</text>
  <line class="w" x1="163" y1="140" x2="170" y2="140"/>
  

  <!-- NOT -->
  <circle class="d" cx="25" cy="178" r="3"/>
  <line class="w" x1="25" y1="178" x2="95" y2="178"/>
  <rect class="box" x="95" y="168" width="68" height="26" rx="3"/>
  <text class="op" x="129" y="185" text-anchor="middle">NOT A</text>
  <line class="w" x1="163" y1="181" x2="170" y2="181"/>
  

  <!-- ADD -->
  <circle class="d" cx="25" cy="219" r="3"/>
  <circle class="d" cx="48" cy="227" r="3"/>
  <line class="w" x1="25" y1="219" x2="95" y2="219"/>
  <line class="w" x1="48" y1="227" x2="95" y2="227"/>
  <rect class="box" x="95" y="209" width="68" height="26" rx="3"/>
  <text class="op" x="129" y="226" text-anchor="middle">ADD</text>
  <line class="w" x1="163" y1="222" x2="170" y2="222"/>
  

  <!-- SUB -->
  <circle class="d" cx="25" cy="260" r="3"/>
  <circle class="d" cx="48" cy="268" r="3"/>
  <line class="w" x1="25" y1="260" x2="95" y2="260"/>
  <line class="w" x1="48" y1="268" x2="95" y2="268"/>
  <rect class="box" x="95" y="250" width="68" height="26" rx="3"/>
  <text class="op" x="129" y="267" text-anchor="middle">SUB</text>
  <line class="w" x1="163" y1="263" x2="170" y2="263"/>
  

  <!-- SHL -->
  <circle class="d" cx="25" cy="301" r="3"/>
  <line class="w" x1="25" y1="301" x2="95" y2="301"/>
  <rect class="box" x="95" y="291" width="68" height="26" rx="3"/>
  <text class="op" x="129" y="308" text-anchor="middle">SHL</text>
  <line class="w" x1="163" y1="304" x2="170" y2="304"/>
  

  <!-- SHR -->
  <circle class="d" cx="25" cy="342" r="3"/>
  <line class="w" x1="25" y1="342" x2="95" y2="342"/>
  <rect class="box" x="95" y="332" width="68" height="26" rx="3"/>
  <text class="op" x="129" y="349" text-anchor="middle">SHR</text>
  <line class="w" x1="163" y1="345" x2="170" y2="345"/>
  

  <!-- MUX -->
  <rect class="mux" x="170" y="32" width="48" height="330" rx="4"/>
  <text class="lb" x="194" y="193" text-anchor="middle">M</text>
  <text class="lb" x="194" y="206" text-anchor="middle">U</text>
  <text class="lb" x="194" y="219" text-anchor="middle">X</text>

  <!-- OP select from top -->

  <!-- OUT -->
  <line class="w" x1="218" y1="197" x2="310" y2="197"/>
  <text class="lb" x="225" y="190">OUT</text>

</svg>
