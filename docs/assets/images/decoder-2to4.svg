<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360">
  <style>
    .w { stroke: #9575cd; stroke-width: 1.5; fill: none; }
    .g { stroke: #9575cd; stroke-width: 1.5; fill: #1e1e2e; }
    .lb { font-family: "JetBrains Mono", monospace; font-size: 13px; fill: #cdd6f4; }
    .d { fill: #9575cd; }
  </style>

  <!-- A input -->
  <line class="w" x1="20" y1="50" x2="60" y2="50"/>
  <text class="lb" x="4" y="54">A</text>
  <!-- junction dot on A -->
  <circle class="d" cx="60" cy="50" r="4"/>
  <!-- A rail going down — stops at y=322 (bottom of Y3 AND gate) -->
  <line class="w" x1="60" y1="50" x2="60" y2="322"/>
  <!-- A wire to NOT gate (starts after junction) -->
  <line class="w" x1="60" y1="50" x2="140" y2="50"/>
  <!-- NOT A gate — moved right to x=140 -->
  <polygon class="g" points="140,37 140,63 175,50"/>
  <circle class="g" cx="181" cy="50" r="7"/>
  <!-- A' wire -->
  <line class="w" x1="188" y1="50" x2="230" y2="50"/>
  <circle class="d" cx="230" cy="50" r="4"/>
  <!-- A' rail down — stops at y=296 -->
  <line class="w" x1="230" y1="50" x2="230" y2="248"/>

  <!-- B input -->
  <line class="w" x1="20" y1="140" x2="90" y2="140"/>
  <text class="lb" x="4" y="144">B</text>
  <!-- junction dot on B -->
  <circle class="d" cx="90" cy="140" r="4"/>
  <!-- B rail going down — stops at y=336 -->
  <line class="w" x1="90" y1="140" x2="90" y2="260"/>
  <!-- B wire to NOT gate -->
  <line class="w" x1="90" y1="140" x2="140" y2="140"/>
  <!-- NOT B gate -->
  <polygon class="g" points="140,127 140,153 175,140"/>
  <circle class="g" cx="181" cy="140" r="7"/>
  <!-- B' wire -->
  <line class="w" x1="188" y1="140" x2="260" y2="140"/>
  <circle class="d" cx="260" cy="140" r="4"/>
  <!-- B' rail down — stops at y=310 -->
  <line class="w" x1="260" y1="140" x2="260" y2="296"/>

  <!-- Y0: A' AND B' -->
  <line class="w" x1="230" y1="210" x2="320" y2="210"/>
  <line class="w" x1="260" y1="222" x2="320" y2="222"/>
  <circle class="d" cx="230" cy="210" r="4"/>
  <circle class="d" cx="260" cy="222" r="4"/>
  <path class="g" d="M320,202 L320,230 Q352,230 352,216 Q352,202 320,202 Z"/>
  <line class="w" x1="352" y1="216" x2="510" y2="216"/>
  <text class="lb" x="515" y="220">Y0</text>

  <!-- Y1: A' AND B -->
  <line class="w" x1="230" y1="248" x2="320" y2="248"/>
  <line class="w" x1="90" y1="260" x2="320" y2="260"/>
  <circle class="d" cx="230" cy="248" r="4"/>
  <circle class="d" cx="90" cy="260" r="4"/>
  <line class="w" x1="90" y1="260" x2="90" y2="334"/>
  <path class="g" d="M320,240 L320,268 Q352,268 352,254 Q352,240 320,240 Z"/>
  <line class="w" x1="352" y1="254" x2="510" y2="254"/>
  <text class="lb" x="515" y="258">Y1</text>

  <!-- Y2: A AND B' -->
  <line class="w" x1="60" y1="284" x2="320" y2="284"/>
  <line class="w" x1="260" y1="296" x2="320" y2="296"/>
  <circle class="d" cx="60" cy="284" r="4"/>
  <circle class="d" cx="260" cy="296" r="4"/>
  <path class="g" d="M320,276 L320,304 Q352,304 352,290 Q352,276 320,276 Z"/>
  <line class="w" x1="352" y1="290" x2="510" y2="290"/>
  <text class="lb" x="515" y="294">Y2</text>

  <!-- Y3: A AND B -->
  <line class="w" x1="60" y1="322" x2="320" y2="322"/>
  <line class="w" x1="90" y1="334" x2="320" y2="334"/>
  <circle class="d" cx="60" cy="322" r="4"/>
  <circle class="d" cx="90" cy="334" r="4"/>
  <path class="g" d="M320,314 L320,342 Q352,342 352,328 Q352,314 320,314 Z"/>
  <line class="w" x1="352" y1="328" x2="510" y2="328"/>
  <text class="lb" x="515" y="332">Y3</text>

</svg>
